# Project-specific mise config for this dotfiles repository
# Docs: https://mise.jdx.dev/configuration.html

min_version = { soft = "2025.1.0" }

[tools]
# Shell tooling used for dotfiles maintenance
python = "3.13.11"
shellcheck = "latest"
shfmt = "latest"
gitleaks = "latest"

[tasks.mise-install]
description = "Install tools from mise.toml"
run = "mise install"

[tasks.lint-shell]
description = "Lint shell scripts in this repo"
run = [
  "shellcheck bootstrap.sh bootstrap-omarchy.sh bash/*.sh gh/*.sh git/install*.sh k9s/install.sh codeburn/install.sh macos/.macos theme/install.sh theme/install-starship.sh theme/install-btop.sh glow/install.sh system/.aliases system/.exports system/.functions system/.path zsh/.zshrc zsh/*.zsh zsh/*.theme scripts/*.sh",
]

[tasks.fmt-shell]
description = "Format shell scripts in this repo"
run = [
  "shfmt -w bootstrap.sh bootstrap-omarchy.sh bash/*.sh gh/*.sh git/install*.sh k9s/install.sh codeburn/install.sh macos/.macos theme/install.sh theme/install-starship.sh theme/install-btop.sh glow/install.sh zsh/.zshrc zsh/*.zsh scripts/*.sh",
]

[tasks.fmt-check]
description = "Check shell formatting without writing"
run = [
  "shfmt -d bootstrap.sh bootstrap-omarchy.sh bash/*.sh gh/*.sh git/install*.sh k9s/install.sh codeburn/install.sh macos/.macos theme/install.sh theme/install-starship.sh theme/install-btop.sh glow/install.sh zsh/.zshrc zsh/*.zsh scripts/*.sh",
]

[tasks.check]
description = "Run core validation for this repo"
run = [
  "mise run lint-shell",
  "mise run fmt-check",
  "mise run docs-check",
  "bash -n bootstrap.sh",
  "bash -n bootstrap-omarchy.sh",
  "bash -n bash/bashrc",
  "bash -n bash/install.sh",
  "bash -n k9s/install.sh",
  "bash -n codeburn/install.sh",
  "bash -n macos/.macos",
  "bash -n theme/install.sh theme/install-starship.sh theme/install-btop.sh",
  "bash -n glow/install.sh",
  "bash -n gh/*.sh git/install*.sh",
  "bash -n scripts/doctor-ai.sh",
  "bash -n scripts/bootstrap-verify.sh",
  "bash -n system/.aliases",
  "bash -n system/.exports",
  "bash -n system/.functions",
  "bash -n system/.path",
]

[tasks.herdr-settings-check]
description = "Check herdr-app settings.macos.json and settings.linux.json match apart from zoom, font_size and font_weight"
# ponytail: exits 1 on drift beyond zoom, font_size and font_weight; intentional drift is committed with SKIP=herdr-settings-sync.
shell = "bash -c"
run = "diff -u --label settings.macos.json --label settings.linux.json <(jq -S 'del(.zoom, .font_size, .font_weight)' herdr-app/settings.macos.json) <(jq -S 'del(.zoom, .font_size, .font_weight)' herdr-app/settings.linux.json) || { echo 'herdr-app settings differ beyond zoom, font_size and font_weight. Copy the change to the other file, or if the drift is intentional commit with SKIP=herdr-settings-sync.' >&2; exit 1; }"

[tasks.herdr-test]
description = "Run every herdr-app mod's node tests"
run = "node --test herdr-app/mods/*/*.test.mjs"

[tasks.bootstrap-verify]
description = "Verify expected post-bootstrap config links/files"
run = "./scripts/bootstrap-verify.sh"

[tasks.ai-doctor]
description = "Check AI toolchain binaries/config/env"
run = "./scripts/doctor-ai.sh"

[tasks.docs-build]
description = "Regenerate the docs site data from repo sources"
run = "python3 ./scripts/generate-docs.py"

[tasks.docs-check]
description = "Check topic documentation, local links, and generated data"
run = [
  "python3 -m unittest discover -s scripts -p test_check_docs.py",
  "python3 ./scripts/check-docs.py",
]

[tasks.docs-serve]
description = "Serve the docs site locally with mise-managed Python"
run = "python3 -m http.server 4173 --directory docs"

[tasks.verify]
description = "Run AI doctor + bootstrap verification"
run = ["mise run ai-doctor", "mise run bootstrap-verify"]

[tasks.precommit-install]
description = "Install git pre-commit hooks"
run = "pre-commit install"

[tasks.precommit-run]
description = "Run pre-commit hooks across all files"
run = "pre-commit run --all-files"

[tasks.secrets-scan]
description = "Run gitleaks against repository"
run = "gitleaks detect --source . --verbose"

[tasks.doctor]
description = "Run mise diagnostics"
run = "mise doctor"
