onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "catppuccin"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Swap the focused pane with its neighbor. Herdr's default for this was
# prefix+shift+h/j/k/l; those chords now enter resize mode.
swap_pane_left = "prefix+ctrl+left"
swap_pane_down = "prefix+ctrl+down"
swap_pane_up = "prefix+ctrl+up"
swap_pane_right = "prefix+ctrl+right"

# prefix+shift+k stays close_workspace, which already owned that chord
# (it shadowed the default swap-up binding).
resize_mode = ["prefix+shift+h", "prefix+shift+j", "prefix+shift+l"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"

# Worktrees: the g family - goto (prefix+g), new (prefix+shift+g), open (prefix+ctrl+g)
open_worktree = "prefix+ctrl+g"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

# Keep split panes separated and outline their outer edges
pane_gaps = true
pane_outer_borders = true

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

# Agent finished / needs-input chimes. Ghostty does not play these.
[ui.sound]
enabled = false

[worktrees]
# Keep herdr-created checkouts alongside the existing ~/worktrees/<repo>/... layout
directory = "~/worktrees"

# $pr, $review, $comment, $merge, $deploy and $ports are pushed by herdr-sidebar-feed in this directory (herdr/install.sh runs it as a service)
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  # herdr-sidebar-feed tags $pr with a zero-width marker per state.
  # Catppuccin Mocha mauve merged, red CI failed, yellow running, green passed.
  # $review: green approved, red changes requested. $comment: blue new review since last push. $merge: peach conflict, sky queued
  # $deploy: green ▲ live, yellow △ in progress, red ▼ failed, ▵ (no rule, dim) paused
  [{ token = "$pr", dim = true, rules = [
    { contains = "\u200B", fg = "#cba6f7" },
    { contains = "\u2062", fg = "#f38ba8" },
    { contains = "\u2061", fg = "#f9e2af" },
    { contains = "\u2060", fg = "#a6e3a1" },
  ] }, { token = "$review", dim = true, rules = [
    { contains = "✓", fg = "#a6e3a1" },
    { contains = "✗", fg = "#f38ba8" },
  ] }, { token = "$comment", dim = true, rules = [
    { contains = "※", fg = "#89b4fa" },
  ] }, { token = "$merge", dim = true, rules = [
    { contains = "↯", fg = "#fab387" },
    { contains = "≡", fg = "#89dceb" },
  ] }, { token = "$deploy", dim = true, rules = [
    { contains = "▲", fg = "#a6e3a1" },
    { contains = "△", fg = "#f9e2af" },
    { contains = "▼", fg = "#f38ba8" },
  ] }],
  ["$ports"],
]
