# Catppuccin status line, built from theme/palette.sh.
# Lives in its own file because tmux parses a whole file before running it:
# $CATPPUCCIN_* only expands in a file sourced *after* the palette is loaded.
set -g status-style "bg=$CATPPUCCIN_BASE,fg=$CATPPUCCIN_TEXT"
set -g status-left " #[fg=$CATPPUCCIN_MAUVE,bold]#S #[default]"
set -g status-right "#[fg=$CATPPUCCIN_OVERLAY0]%Y-%m-%d #[fg=$CATPPUCCIN_BLUE]%H:%M #[default]"
set -g window-status-format " #[fg=$CATPPUCCIN_OVERLAY0]#I:#W #[default]"
set -g window-status-current-format " #[fg=$CATPPUCCIN_GREEN,bold]#I:#W #[default]"
set -g pane-border-style "fg=$CATPPUCCIN_SURFACE1"
set -g pane-active-border-style "fg=$CATPPUCCIN_BLUE"
