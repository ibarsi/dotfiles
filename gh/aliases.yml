# GitHub CLI aliases, loaded by gh/install.sh via `gh alias import --clobber`.
# Edit here, then re-run gh/install.sh; `gh alias set` changes won't be kept.
mq: |
    !gh api graphql -F owner='{owner}' -F repo='{repo}' -f query='
    query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){mergeQueue{entries(first:50){nodes{
      position state pullRequest{number title author{login}}}}}}}' --jq '
      {MERGEABLE:"32",AWAITING_CHECKS:"33",QUEUED:"36",UNMERGEABLE:"31",LOCKED:"35"} as $c
      | .data.repository.mergeQueue.entries.nodes[]?
      | "\(.position)\t\u001b[\($c[.state] // "0")m\(.state)\u001b[0m\t\u001b[1m#\(.pullRequest.number)\u001b[0m\t\u001b[2m\(.pullRequest.author.login)\u001b[0m\t\(.pullRequest.title)"'
ci: |
    !f='.[]'
    for a; do shift; case "$a" in
      --failed) f='.[] | select(.bucket == "fail")' ;;
      --passed) f='.[] | select(.bucket == "pass")' ;;
      --pending) f='.[] | select(.bucket == "pending")' ;;
      *) set -- "$@" "$a" ;;
    esac; done
    gh pr checks "$@" --json bucket,name,workflow,link --jq '
      {fail:"31",cancel:"35",pending:"33",pass:"32",skipping:"2"} as $c
      | {fail:0,cancel:1,pending:2,pass:3,skipping:4} as $o
      | sort_by($o[.bucket] // 9, .workflow, .name) | '"$f"'
      | "\u001b[\($c[.bucket] // "0")m\(.bucket)\u001b[0m\t\u001b[1m\(.name)\u001b[0m\t\u001b[2m\(.workflow)\t\(.link)\u001b[0m"'
reviews: |
    !me=$(gh api user --jq .login)
    gh pr view "$@" --json reviews,commits --jq '
      {APPROVED:"32",CHANGES_REQUESTED:"31",COMMENTED:"2",DISMISSED:"35"} as $c
      | [.commits[] | select(.messageHeadline | test("^Merge ") | not) | .authoredDate] as $a
      | .reviews[] | select(.author.login != "'"$me"'") | .submittedAt as $t | ([$a[] | select(. > $t)] | length) as $n
      | (if $n == 0 then "\u001b[32mup to date" else "\u001b[33m\($n) commits since" end) as $s
      | "\($t)\t\u001b[1m\(.author.login)\u001b[0m\t\u001b[\($c[.state] // "0")m\(.state)\u001b[0m\t\($s)\u001b[0m"'
url: pr view --json url --jq .url
bd: |
    !stage=$1; pr=${2:-$(gh pr view --json number -q .number)}
    if [ -z "$stage" ]; then
      gh pr view "$pr" --json comments \
        --jq '.comments[] | select(.body | contains("<!-- branch-deploy-status -->")) | .body' |
        grep -v '^- .*→' | sed -E 's/\[([^]]*)\]\([^)]*\)/\1/g' | glow -
      exit
    fi
    app="sys-argocd/max1-dev-us-gcp-e4-bnk-pr-$pr-$stage"
    json=$(argocd app get "$app" -o json --grpc-web) || exit 1
    echo "== $app"
    echo "$json" | jq -r '.status | "sync: \(.sync.status)  health: \(.health.status)\nlast op: \(.operationState.phase // "-") \(.operationState.message // "")"'
    echo; echo "== not healthy"
    argocd app resources "$app" --output tree=detailed --grpc-web | grep -vE 'Healthy|^[[:space:]]*$' || echo "(none)"
    echo "$json" | jq -r '.status.resources[] | select((.health.status // "Healthy") != "Healthy")
      | select(.kind == "Deployment" or .kind == "StatefulSet") | "\(.kind) \(.name)"' |
      while read -r kind name; do
        echo; echo "== logs: $kind/$name (last 30)"
        argocd app logs "$app" --kind "$kind" --group apps --name "$name" --tail 30 --grpc-web 2>&1
      done
